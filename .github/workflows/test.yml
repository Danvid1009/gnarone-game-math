name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [rgs-math, payout-engine, stepper-engine, race-engine, rumble-engine, smash-engine, pick-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: ${{ matrix.dir }}
